packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: install scripts run only for allow-listed packages.
# true = native/binary deps that need their build scripts;
# es5-ext's postinstall is non-functional advocacy output — kept off.
# @bitbaum/mail-kit is our own just-published package; exempt it from the
# minimum-release-age hold so it can install on day one.
minimumReleaseAgeExclude:
  - "@bitbaum/mail-kit"
  # bip-kit is ours too (bitbaum/bip-kit); the 0.2.x line is days old. Without
  # this entry `pnpm install --frozen-lockfile` refuses it in CI as a bare
  # exit-1 with no annotation, which reads like a broken build rather than a
  # held-back dependency.
  - "bip-kit"
  - '@bitbaum/ai-kit@0.15.0 || 1.11.0'

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  es5-ext: false
  esbuild: true
  unrs-resolver: true

# @auth/drizzle-adapter still pins @auth/core 0.41.1, which is inside the
# vulnerable range for the next-auth advisory (first patched 0.41.3). The
# adapter only uses @auth/core for its types — next-auth itself resolves 0.41.3
# — but a second, older copy in the tree is still a copy an audit will find and
# a bundler could reach. Patch-level lift, same minor.
overrides:
  "@auth/core": ">=0.41.3"
  # Transitive-only advisories. 58 of this repo's 62 high alerts were against
  # pnpm-lock.yaml with no direct dependency to bump, and Dependabot has never
  # opened a PR for any of them -- a transitive advisory in a pnpm workspace is
  # outside what it can compute, so they accumulate with nothing to merge.
  #
  # Each pin is the advisory's own first_patched_version and is BOUNDED to one
  # major: an open-ended ">=3.1.6" on fast-uri resolves to 4.x, which is a major
  # upgrade wearing a security patch's clothes. The @N in the key selects which
  # requests to override; it does not bound the result.
  #
  # drizzle-orm and serialize-javascript are deliberately absent: their patched
  # versions cross a breaking boundary and belong in their own PR.
  "@hono/node-server@1": "^1.19.10"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@2": "^2.1.4"
  "browserslist@4": "^4.28.7"
  "fast-uri@3": "^3.1.6"
  "fast-xml-builder@1": "^1.1.7"
  "fast-xml-parser@5": "^5.5.6"
  "flatted@3": "^3.4.2"
  "form-data@4": "^4.0.6"
  "hono@4": "^4.12.25"
  "js-yaml@3": "^3.15.2"
  "js-yaml@4": "^4.3.2"
  "minimatch@3": "^3.1.4"
  "minimatch@5": "^5.1.8"
  "minimatch@7": "^7.4.8"
  "minimatch@8": "^8.0.6"
  "minimatch@9": "^9.0.7"
  "nanoid@3": "^3.3.18"
  "picomatch@4": "^4.0.4"
  "postcss@8": "^8.5.18"
  "rollup@3": "^3.30.0"
  "rollup@4": "^4.59.0"
  "vite@7": "^7.3.5"
  "ws@8": "^8.21.0"
  # 2026-09-25: the medium/low remainder, same rule -- first_patched_version,
  # bounded to one major (or one minor on 0.x).
  # tsx carries esbuild; drizzle-kit pins its own tsx ^4.21 (esbuild ~0.27,
  # vulnerable). ^4.23.15 is inside every declared range and brings ~0.28.
  "tsx@4": "^4.23.15"
  "@babel/core@7": "^7.29.6"
  "@opentelemetry/core@2": "^2.8.0"
  "ajv@6": "^6.14.0"
  "picomatch@2": "^2.3.2"
  "postcss-selector-parser@6": "^6.1.3"
  "qs@6": "^6.16.0"
  "serialize-javascript@7": "^7.0.5"
  "uuid@11": "^11.1.1"
