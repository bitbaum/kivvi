packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: install scripts run only for allow-listed packages.
# true = native/binary deps that need their build scripts;
# es5-ext's postinstall is non-functional advocacy output — kept off.
# @bitbaum/mail-kit is our own just-published package; exempt it from the
# minimum-release-age hold so it can install on day one.
minimumReleaseAgeExclude:
  - "@bitbaum/mail-kit"
  # bip-kit is ours too (bitbaum/bip-kit); the 0.2.x line is days old. Without
  # this entry `pnpm install --frozen-lockfile` refuses it in CI as a bare
  # exit-1 with no annotation, which reads like a broken build rather than a
  # held-back dependency.
  - "bip-kit"
  # Ours, published from this fleet minutes ago by its OIDC trusted publisher.
  # Pinned to the exact version: a bare name would exempt every FUTURE version
  # too, quietly disabling the gate for the package most likely to be installed
  # the minute it is released.
  - "@bitbaum/ai-kit@0.15.0"

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  es5-ext: false
  esbuild: true
  unrs-resolver: true

# @auth/drizzle-adapter still pins @auth/core 0.41.1, which is inside the
# vulnerable range for the next-auth advisory (first patched 0.41.3). The
# adapter only uses @auth/core for its types — next-auth itself resolves 0.41.3
# — but a second, older copy in the tree is still a copy an audit will find and
# a bundler could reach. Patch-level lift, same minor.
overrides:
  "@auth/core": ">=0.41.3"

  # Transitive-only advisories that a lockfile refresh cannot reach, because the
  # parent package pins a range that excludes the patched version. Dependabot
  # never opens a PR for these: 58 of this repo's 62 high alerts were against
  # pnpm-lock.yaml with no direct dependency to bump, so they accumulated with no
  # proposed fix at all. Each lift below is within the same major, and the version
  # is the advisory's own `first_patched_version`.
  fast-uri@3: "^3.1.6"
  nanoid@3: "^3.3.18"
  picomatch@4: "^4.0.4"
  postcss@8: "^8.5.18"
  rollup@3: "^3.30.0"
  rollup@4: "^4.59.0"
  vite@7: "^7.3.5"
