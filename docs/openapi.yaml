          nullable: true
        serialNumberTracking:
          type: boolean
          default: false
        shopVisible:
          type: boolean
          default: false
        isPriceFlexible:
          type: boolean
          default: false
        minPrice:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          nullable: true
        maxPrice:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          nullable: true
        notes:
