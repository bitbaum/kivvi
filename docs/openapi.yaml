openapi: 3.0.3
info:
  title: Kivvi ERP API
  description: |
    REST API for Kivvi ERP — Swiss-native ERP for businesses selling used, donated,
    and refurbished goods.

    ## Authentication

    All endpoints require a Bearer token issued by the Kivvi instance.

    ```
    Authorization: Bearer kv_...
    ```

    ## Response envelope

    Every response wraps the payload in a standard envelope:

    ```json
    { "success": true, "data": { ... }, "meta": { "total": 100, "page": 1, "pageSize": 50, "totalPages": 2 } }
    { "success": false, "error": "Human-readable error message" }
    ```

    `meta` is only present on list endpoints.

    ## Financial values

    All monetary amounts (prices, totals, VAT, etc.) are returned and accepted as
    **decimal strings** (e.g. `"47.50"`) to avoid floating-point rounding errors.

    ## Idempotency

    Write endpoints accept an optional `Idempotency-Key` header. When provided,
    retries with the same key return the stored response (`Idempotent-Replayed: true`)
    instead of re-executing. Supported on: `POST /inventory-items`,
    `PATCH /inventory-items/{id}`, `POST /documents`, `PUT /documents/{id}` (status-only),
    `POST /documents/{id}/payments`, `POST /marketplace/*`.

    ## Webhooks (outbound)

    Kivvi emits signed POST requests to URLs configured under Settings → Webhooks.

    | Header | Value |
    |--------|-------|
    | `X-Kivvi-Event` | Event name (see below) |
    | `X-Kivvi-Signature` | `HMAC-SHA256(rawBody, secret)` hex digest |
    | `Content-Type` | `application/json` |

    **Payload envelope:**

    ```json
    {
      "event": "inventory_item.status_changed",
      "timestamp": "2026-07-09T08:00:00.000Z",
      "companyId": "uuid",
      "data": {
        "id": "uuid",
        "itemNumber": "IT-00042",
        "description": "ThinkPad T480",
        "condition": "good",
        "status": "sold",
        "warehouseId": "uuid",
        "askingPrice": "350.00"
      }
    }
    ```

    **Events:** `inventory_item.created`, `inventory_item.updated`,
    `inventory_item.status_changed`, `document.created`, `document.status_changed`,
    `payment.received`.

    Combined `PATCH /inventory-items/{id}` (status + fields) emits **one** event;
    `status_changed` wins over `updated`.

    ## Dates

    Dates are stored and returned as ISO 8601 strings (`YYYY-MM-DD`).
  version: 1.0.0
  contact:
    name: Kivvi ERP
    url: https://kivvi.ch

servers:
  - url: /api/v1
    description: Current version

security:
  - bearerAuth: []

tags:
  - name: Contacts
    description: Customers and vendors
  - name: Products
    description: Products and services catalog
  - name: Documents
    description: All business documents (quotes, orders, invoices, etc.)
  - name: Inventory Items
    description: Individual physical items tracked through intake → sale lifecycle
  - name: Marketplace
    description: P2P facilitated-sale agency accounting (commission + pass-through)

# ==============================================================================
# PATHS
# ==============================================================================

paths:
  # ----------------------------------------------------------------------------
  # Contacts
  # ----------------------------------------------------------------------------

  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts
      operationId: listContacts
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: search
          in: query
          description: Filter by name, email, or contact number (case-insensitive)
          schema:
            type: string
        - name: type
          in: query
          description: Filter by contact type
          schema:
            type: string
            enum: [customer, vendor]
      responses:
        "200":
          description: Paginated list of contacts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Contact"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Contacts]
      summary: Create a contact
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "200":
          description: Created contact
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /contacts/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      tags: [Contacts]
      summary: Get a contact
      operationId: getContact
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Contact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Contacts]
      summary: Update a contact
      operationId: updateContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Contacts]
      summary: Delete a contact
      operationId: deleteContact
      responses:
        "200":
          description: Contact deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                            example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ----------------------------------------------------------------------------
  # Products
  # ----------------------------------------------------------------------------

  /products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: search
          in: query
          description: Filter by name, description, or article number (case-insensitive)
          schema:
            type: string
        - name: type
          in: query
          description: Filter by product type
          schema:
            type: string
            enum: [product, service]
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Product"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: Created product
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      tags: [Products]
      summary: Get a product
      operationId: getProduct
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Products]
      summary: Update a product
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Products]
      summary: Delete a product
      operationId: deleteProduct
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                            example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ----------------------------------------------------------------------------
  # Documents
  # ----------------------------------------------------------------------------

  /documents:
    get:
      tags: [Documents]
      summary: List documents
      operationId: listDocuments
      parameters:
        - $ref: "#/components/parameters/page"
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: type
          in: query
          description: Filter by document type
          schema:
            $ref: "#/components/schemas/DocumentType"
        - name: status
          in: query
          description: Filter by document status
          schema:
            $ref: "#/components/schemas/DocumentStatus"
        - name: search
          in: query
          description: Filter by document number or contact name
          schema:
            type: string
        - name: contactId
          in: query
          description: Filter by contact UUID
          schema:
            type: string
            format: uuid
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [number, issueDate, dueDate, total, createdAt]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated list of documents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Document"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Documents]
      summary: Create a document
      description: |
        Creates any document type (quote, order, invoice, etc.).

        **Contact resolution**: instead of providing a `contactId`, external callers
        may supply `contactName` (required) and `contactEmail` (optional). The API
        resolves the contact by email, then by name, and creates a new customer
        record if no match is found.

        **Item positions**: the `position` field on line items is optional. If
        omitted, items are auto-numbered starting at 1 in the order they appear.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "200":
          description: Created document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /documents/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      tags: [Documents]
      summary: Get a document
      operationId: getDocument
      responses:
        "200":
          description: Document with line items and payment records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DocumentWithItems"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Documents]
      summary: Update or transition a document
      operationId: updateDocument
      description: |
        Two behaviors depending on the request body:

        - **Status transition**: send `{ "status": "<new_status>" }` as the only
          field. The status transition is validated against the allowed transition
          graph. See the `DocumentStatus` schema for the full lifecycle.
        - **Full update**: send any combination of updatable fields (contactId,
          dates, notes, items). Replaces line items when `items` is provided.

        **Idempotency** (status-only body): send `Idempotency-Key` (e.g.
        `marketplace-order:{orderId}:sent`) so webhook retries cannot duplicate
        transitions.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/UpdateDocumentStatusRequest"
                - $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Documents]
      summary: Delete a document
      operationId: deleteDocument
      description: Only draft documents can be deleted.
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                            example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/id"

    post:
      tags: [Documents]
      summary: Record a payment
      operationId: recordPayment
      description: |
        Record a payment against an invoice. The document must be in a payable
        status (`sent` or `partially_paid`). Automatically transitions the document
        to `paid` or `partially_paid` based on the remaining balance.

        Typical use: close the accounting loop after receiving a Payrexx webhook
        or a bank transfer confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPaymentRequest"
      responses:
        "200":
          description: Payment record
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DocumentPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ----------------------------------------------------------------------------
  # Inventory Items
  # ----------------------------------------------------------------------------

  /inventory-items:
    get:
      tags: [Inventory Items]
      summary: List inventory items
      operationId: listInventoryItems
      parameters:
        - $ref: "#/components/parameters/page"
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: status
          in: query
          description: Filter by lifecycle status
          schema:
            $ref: "#/components/schemas/ItemStatus"
        - name: condition
          in: query
          description: Filter by physical condition grade
          schema:
            $ref: "#/components/schemas/ItemCondition"
        - name: warehouseId
          in: query
          description: Filter by warehouse UUID
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Filter by description (case-insensitive substring match)
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, description, status, condition]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated list of inventory items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/InventoryItem"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Inventory Items]
      summary: Create an inventory item
      operationId: createInventoryItem
      description: |
        Creates a new inventory item in `intake` status. Used when logging a
        donated, purchased, or traded-in item into the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemRequest"
      responses:
        "200":
          description: Created inventory item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /inventory-items/{id}:
    parameters:
      - $ref: "#/components/parameters/id"

    get:
      tags: [Inventory Items]
      summary: Get an inventory item
      operationId: getInventoryItem
      responses:
        "200":
          description: Inventory item with denormalized product, warehouse, and donor names
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InventoryItemWithDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Inventory Items]
      summary: Update an inventory item
      operationId: patchInventoryItem
      description: |
        Partially updates an inventory item. All fields are optional.

        **Status transitions**: include `status` to trigger a lifecycle transition.
        Transitions are validated — invalid transitions return 400. The allowed
        transitions are:

        ```
        intake       → testing, ready_for_sale, recycled
        testing      → repair, ready_for_sale, parts_only, recycled
        repair       → testing, parts_only, recycled
        ready_for_sale → listed, reserved, donated
        listed       → reserved, sold, ready_for_sale
        reserved     → sold, listed, ready_for_sale
        sold         → returned
        returned     → testing, repair, ready_for_sale, recycled
        donated      → (terminal)
        parts_only   → recycled
        recycled     → (terminal)
        ```

        **Idempotency**: send `Idempotency-Key` (e.g. `inventory-item:{id}:listed`) so
        integrator retries are safe. Replays return the stored response with
        `Idempotent-Replayed: true`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInventoryItemRequest"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InventoryItemWithDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /inventory-items/{id}/repair-labor-invoice:
    parameters:
      - $ref: "#/components/parameters/id"

    post:
      tags: [Inventory Items]
      summary: Create a repair labor invoice
      operationId: createRepairLaborInvoice
      description: |
        Creates a draft sales invoice from the tracked repair hours of an inventory
        item. The invoice line uses a service product so the repaired item stays in
        inventory and is not marked as sold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactId]
              properties:
                contactId:
                  type: string
                  format: uuid
                hours:
                  type: string
                  description: Optional decimal string. Defaults to the item's tracked repair hours.
                hourlyRate:
                  type: string
                  description: >-
                    Optional decimal string in CHF. Falls back to the company's
                    configured default repair hourly rate when omitted; a 400 is
                    returned if neither is available.
                issueDate:
                  type: string
                  format: date
                vatRate:
                  type: string
                  description: Decimal VAT rate string. Defaults to 8.1.
                description:
                  type: string
      responses:
        "200":
          description: Draft repair labor invoice created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          number:
                            type: string
                          type:
                            type: string
                            enum: [invoice]
                          status:
                            type: string
                          total:
                            type: string
                          currency:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ----------------------------------------------------------------------------
  # Marketplace (P2P agency accounting)
  # ----------------------------------------------------------------------------

  /marketplace/agency-sales:
    post:
      tags: [Marketplace]
      summary: Record a facilitated (P2P) marketplace sale
      operationId: recordMarketplaceAgencySale
      description: |
        Books only the platform's economics for a private-seller secure sale —
        never full-price revenue. Use when `is_revampit=false` on the listing.

        Journal: `DR 1020` gross · `CR 2140` seller pass-through ·
        `CR 3200` commission · `CR 2200` VAT on the fee only.

        Send `Idempotency-Key: marketplace-order:{orderId}:paid` so Payrexx
        webhook retries cannot duplicate the entry.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: >-
            Recommended. Stable key per paid order (e.g.
            `marketplace-order:{uuid}:paid`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceAgencySaleInput"
      responses:
        "200":
          description: Journal entry created (or replayed)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JournalEntryRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency key already in progress
        "500":
          $ref: "#/components/responses/InternalError"

  /marketplace/payouts:
    post:
      tags: [Marketplace]
      summary: Record a marketplace seller payout
      operationId: recordMarketplacePayout
      description: |
        Settles the pass-through liability to the private seller from the bank.
        Journal: `DR 2140 / CR 1020`.

        Send `Idempotency-Key: marketplace-order:{orderId}:payout`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplacePayoutInput"
      responses:
        "200":
          description: Journal entry created (or replayed)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JournalEntryRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency key already in progress
        "500":
          $ref: "#/components/responses/InternalError"

# ==============================================================================
# COMPONENTS
# ==============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: kv_...
      description: API key issued by the Kivvi instance

  # ----------------------------------------------------------------------------
  # Parameters
  # ----------------------------------------------------------------------------

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  # ----------------------------------------------------------------------------
  # Responses
  # ----------------------------------------------------------------------------

  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Invalid body: items.0.unitPrice: Invalid unit price"

    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Unauthorized"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Document not found"

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Internal server error"

  # ----------------------------------------------------------------------------
  # Schemas — envelopes
  # ----------------------------------------------------------------------------

  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Human-readable error description

    PaginationMeta:
      type: object
      required: [total, page, pageSize, totalPages]
      properties:
        total:
          type: integer
          description: Total number of matching records
          example: 143
        page:
          type: integer
          description: Current page number (1-based)
          example: 1
        pageSize:
          type: integer
          description: Number of records per page
          example: 50
        totalPages:
          type: integer
          description: Total number of pages
          example: 3

    # ----------------------------------------------------------------------------
    # Schemas — enums
    # ----------------------------------------------------------------------------

    DocumentType:
      type: string
      enum:
        - quote
        - order
        - order_confirmation
        - delivery_note
        - invoice
        - credit_note
        - purchase_order
        - purchase_invoice
        - dunning
        - intake
      description: |
        Document type discriminator. Maps to Swiss abbreviations:
        - `quote` → AN (Angebot)
        - `order` → AU (Auftrag)
        - `order_confirmation` → AB (Auftragsbestätigung)
        - `delivery_note` → LS (Lieferschein)
        - `invoice` → RE (Rechnung)
        - `credit_note` → GU (Gutschrift)
        - `purchase_order` → BE (Bestellung)
        - `purchase_invoice` → ER (Eingangsrechnung)
        - `dunning` → MA (Mahnung)
        - `intake` → intake receipt for donated/traded-in goods

    DocumentStatus:
      type: string
      enum:
        - draft
        - sent
        - confirmed
        - delivered
        - partially_paid
        - paid
        - overdue
        - dunning_1
        - dunning_2
        - dunning_3
        - cancelled
      description: |
        Document lifecycle status. Allowed transitions:
        - `draft` → sent, confirmed, cancelled
        - `sent` → confirmed, paid, partially_paid, overdue, cancelled
        - `confirmed` → delivered, paid, partially_paid, overdue, cancelled
        - `delivered` → paid, partially_paid, overdue, cancelled
        - `partially_paid` → paid, overdue, cancelled
        - `overdue` → paid, partially_paid, dunning_1, cancelled
        - `dunning_1` → paid, partially_paid, dunning_2, cancelled
        - `dunning_2` → paid, partially_paid, dunning_3, cancelled
        - `dunning_3` → paid, partially_paid, cancelled
        - `paid` → (terminal)
        - `cancelled` → (terminal)

    ItemStatus:
      type: string
      enum:
        - intake
        - testing
        - repair
        - ready_for_sale
        - listed
        - reserved
        - sold
        - returned
        - donated
        - recycled

    ItemCondition:
      type: string
      enum:
        - untested
        - like_new
        - good
        - fair
        - poor
        - parts_only
        - scrap

    PaymentMethod:
      type: string
      enum:
        - bank_transfer
        - cash
        - card
        - other

    IntakeSource:
      type: string
      enum:
        - donation
        - purchase
        - trade_in
        - consignment
        - estate_clearance
        - return
        - other

    # ----------------------------------------------------------------------------
    # Schemas — Contact
    # ----------------------------------------------------------------------------

    Contact:
      type: object
      required: [id, companyId, type, name, contactNumber, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        type:
          type: string
          enum: [customer, vendor, both]
        contactNumber:
          type: string
          description: Auto-generated (e.g. K-00001)
          example: K-00042
        name:
          type: string
          example: Digitec AG
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        country:
          type: string
          description: ISO 3166-1 alpha-2
          example: CH
          nullable: true
        vatNumber:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
        paymentTermsDays:
          type: integer
          nullable: true
          description: Net payment term in days
          example: 30
        creditLimit:
          type: string
          nullable: true
          description: Decimal string in CHF
          example: "5000.00"
        language:
          type: string
          nullable: true
          example: de
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateContactRequest:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [customer, vendor, both]
        name:
          type: string
          minLength: 1
          maxLength: 200
        firstName:
          type: string
          maxLength: 100
          nullable: true
        lastName:
          type: string
          maxLength: 100
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          maxLength: 30
          nullable: true
        mobile:
          type: string
          maxLength: 30
          nullable: true
        website:
          type: string
          maxLength: 200
          nullable: true
        address:
          type: string
          maxLength: 500
          nullable: true
        city:
          type: string
          maxLength: 100
          nullable: true
        postalCode:
          type: string
          maxLength: 20
          nullable: true
        country:
          type: string
          maxLength: 5
          nullable: true
        vatNumber:
          type: string
          maxLength: 30
          nullable: true
        iban:
          type: string
          maxLength: 34
          nullable: true
        bic:
          type: string
          maxLength: 11
          nullable: true
        paymentTermsDays:
          type: integer
          minimum: 0
          maximum: 365
          nullable: true
        creditLimit:
          type: string
          nullable: true
          description: Decimal string in CHF
        language:
          type: string
          maxLength: 5
          nullable: true
        notes:
          type: string
          maxLength: 5000
          nullable: true

    UpdateContactRequest:
      allOf:
        - $ref: "#/components/schemas/CreateContactRequest"
      description: All fields are optional for partial updates

    # ----------------------------------------------------------------------------
    # Schemas — Product
    # ----------------------------------------------------------------------------

    Product:
      type: object
      required:
        [
          id,
          companyId,
          name,
          type,
          articleNumber,
          unitPrice,
          vatRate,
          unit,
          currency,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        articleNumber:
          type: string
          description: Auto-generated (e.g. ART-00001)
          example: ART-00001
        name:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [product, service]
        sku:
          type: string
          nullable: true
        ean:
          type: string
          nullable: true
        manufacturerId:
          type: string
          format: uuid
          nullable: true
        productGroupId:
          type: string
          format: uuid
          nullable: true
        unitPrice:
          type: string
          description: Decimal string in CHF (e.g. "49.90")
