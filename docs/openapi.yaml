    # ----------------------------------------------------------------------------
    # Schemas — Document
    # ----------------------------------------------------------------------------

    DocumentItem:
      type: object
      required:
        [
          id,
          documentId,
          position,
          description,
          quantity,
          unitPrice,
          discount,
          vatRate,
          netAmount,
          vatAmount,
          grossAmount,
        ]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
          nullable: true
        inventoryItemId:
          type: string
          format: uuid
          nullable: true
        position:
          type: integer
          description: Line item order (1-based)
        description:
          type: string
        quantity:
          type: string
          description: Decimal string (e.g. "2.0000")
        unitPrice:
          type: string
          description: Decimal string in document currency
        discount:
          type: string
          description: Discount percentage as decimal string (0–100)
          example: "0"
        vatRate:
          type: string
          description: VAT percentage as decimal string
          example: "8.1"
        netAmount:
          type: string
          description: Net line total (quantity × unitPrice × (1 - discount/100))
        vatAmount:
          type: string
          description: VAT amount for this line, rounded per Swiss standard
        grossAmount:
          type: string
          description: Gross line total (net + vat)

    DocumentItemInput:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        productId:
          type: string
          format: uuid
          nullable: true
        inventoryItemId:
          type: string
          format: uuid
          nullable: true
        position:
          type: integer
          minimum: 0
          description: Line order. Auto-assigned if omitted.
        description:
          type: string
          minLength: 1
        quantity:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          example: "1"
        unitPrice:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "49.90"
        discount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: Discount percentage (0–100). Defaults to "0".
          default: "0"
        vatRate:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: VAT rate percentage. Defaults to company default (usually "8.1").
          example: "8.1"

    Document:
      type: object
      required:
        [
          id,
          companyId,
          type,
          status,
          number,
          issueDate,
          currency,
          netTotal,
          vatTotal,
          grossTotal,
          createdAt,
          updatedAt,
