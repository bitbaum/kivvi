        repairCost:
          type: string
          nullable: true
          description: Accumulated repair cost (decimal string in CHF)
        repairHours:
          type: string
          nullable: true
          description: Accumulated repair hours (decimal string)
        repairLog:
          type: string
          nullable: true
          description: Chronological repair notes (newline-delimited entries)
        serialNumber:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
          description: Physical shelf/bin location within the warehouse
        specs:
          type: object
          nullable: true
          description: Flexible key-value technical specifications
          additionalProperties:
            type: string
          example:
            RAM: "8GB"
            Storage: "256GB SSD"
            CPU: "Intel i5"
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InventoryItemWithDetails:
      allOf:
        - $ref: "#/components/schemas/InventoryItem"
        - type: object
          properties:
