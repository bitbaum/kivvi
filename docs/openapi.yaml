        vatRate:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: VAT percentage (e.g. "8.1" for 8.1%)
          example: "8.1"
        unit:
          type: string
          enum: [piece, hour, kg, m, m2, m3, liter]
          default: piece
        weight:
          type: string
          pattern: '^\d+(\.\d{1,3})?$'
          nullable: true
        width:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          nullable: true
        height:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          nullable: true
        depth:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          nullable: true
        minStock:
