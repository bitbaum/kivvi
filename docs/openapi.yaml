        vatTotal:
          type: string
          description: Sum of all line VAT amounts
        grossTotal:
          type: string
          description: Sum of all line gross amounts (= total due)
        paidAmount:
          type: string
          description: Total amount paid against this document
          nullable: true
        qrReference:
