            warehouseName:
              type: string
              nullable: true
              description: Denormalized name from linked warehouse
            donorName:
              type: string
              nullable: true
              description: Denormalized name from linked donor contact
            effectiveCost:
              type: string
              nullable: true
              description: |
                Derived cost basis: estimatedValue + repairCost. Useful for
                margin calculation at point of sale.

