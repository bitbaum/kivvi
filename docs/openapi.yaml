    MarketplaceAgencySaleInput:
      type: object
      required: [orderReference, date, grossAmount]
      properties:
        orderReference:
          type: string
          description: Stable reference, e.g. `MO-{orderId}`
        date:
          type: string
          format: date
        grossAmount:
          type: string
          description: What the buyer paid (decimal string)
        commissionAmount:
          type: string
          default: "0"
          description: Platform fee excl. VAT
        commissionVatAmount:
          type: string
          default: "0"
          description: VAT on the commission fee only
        sourceId:
          type: string
          description: External order UUID for journal sourceId
        description:
          type: string

    MarketplacePayoutInput:
      type: object
      required: [amount, date, reference]
      properties:
        amount:
